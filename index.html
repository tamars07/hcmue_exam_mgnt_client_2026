    <!--
      MathJax 3 (same version/config as the backend's council & question-bank views).
      Nothing in this app currently renders question/answer HTML, so there's no
      typesetPromise() call yet — add one (see hcmue_client_2026's utils/mathjax.js
      for the pattern) if a page here starts displaying question content.
    -->
    <script>
      window.MathJax = {
        loader: {
          load: ['[tex]/mhchem']
        },
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          packages: { '[+]': ['mhchem'] }
        },
        svg: {
          fontCache: 'global'
        },
        startup: {
          typeset: false
        }
      };
    </script>
    <script id="MathJax-script" async src="/MathJax/tex-mml-svg.js"></script>
